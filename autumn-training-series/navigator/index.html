<!doctype html>
<html lang="en-GB">
<head>

  <meta name="theme-color" content="#071b2f">

  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071b2f; }

    iframe {
      display: block;
      width: 100%;
      height: 100%;

    }
    .fallback {
      position: fixed;
      inset: auto 1rem max(1rem, env(safe-area-inset-bottom)) 1rem;

      margin: 0 auto;
      max-width: 34rem;
      padding: .7rem 1rem;
      border-radius: .75rem;

      text-align: center;
    }
    .fallback a { color: #8fe3d4; }

</head>
<body>
  <iframe
    src="https://solent-race-navigator.lucyijdavis.chatgpt.site"
    title="Solent Race Navigator"
    allow="geolocation; fullscreen; screen-wake-lock"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <noscript>
    <p class="fallback">JavaScript is required. <a href="https://solent-race-navigator.lucyijdavis.chatgpt.site">Open the navigator directly</a>.</p>
