<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Loader test — Beyond the Shift (beta)</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../beta.css?v=20261120a">
  <link rel="stylesheet" href="../booking/booking.css?v=20261120a">
  <style>
    .lt-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .lt-bar label { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
    .lt-bar select { background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; font: inherit; }
    .lt-timer { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
    .lt-panels { display: grid; gap: 18px; }
    .lt-done { color: var(--t-no); font-weight: 700; }
  </style>
</head>
<body class="bk-page">
  <main>
    <div class="bk-wrap">
      <div>
        <h1 class="bk-title">Loader test</h1>
        <p class="bk-sub">Each refresh fakes a booking-system wait, then shows the page. Real waits are usually 3–4 s.</p>
      </div>
      <div class="lt-bar">
        <label>Style <select data-style>
          <option value="race">Race (long waits, 3 s+)</option>
          <option value="wave">Wave (1–3 s)</option>
          <option value="start">Start line (long waits)</option>
          <option value="all">All three</option>
          <option value="who">Who's going list</option>
        </select></label>
        <label>Wait <select data-wait>
          <option value="1">1 s</option>
          <option value="2">2 s</option>
          <option value="5">5 s (default)</option>
          <option value="3.5">3.5 s (typical)</option>
          <option value="14">14 s (slow)</option>
          <option value="30">30 s (very slow)</option>
        </select></label>
        <label>Show <select data-layout>
          <option value="full">Full page loader</option>
          <option value="card">Inside a card (compact)</option>
          <option value="both">Both</option>
        </select></label>
        <label>Scene <select data-scene>
          <option value="">Random</option>
          <option value="1">1 · X recall</option>
          <option value="2">2 · Clean start</option>
          <option value="3">3 · Over near the boat end</option>
        </select></label>
        <button class="btn btn-accent" type="button" data-replay>Replay</button>
        <span class="lt-timer" data-timer></span>
      </div>
      <div class="lt-panels" data-panels></div>
    </div>
  </main>
  <script src="../booking/config.js?v=20261120a"></script>
  <script src="../booking/api.js?v=20261120a"></script>
  <script src="../booking/loader.js?v=20261120a"></script>
  <script src="../booking/ui.js?v=20261120a"></script>
  <script>
  (() => {
    const q = new URLSearchParams(location.search);
    const waitSel = document.querySelector("[data-wait]"), layoutSel = document.querySelector("[data-layout]"), styleSel = document.querySelector("[data-style]"), sceneSel = document.querySelector("[data-scene]");
    if (q.get("style")) styleSel.value = q.get("style");
    if (q.get("wait")) { if (![...waitSel.options].some(o => o.value === q.get("wait"))) waitSel.add(new Option(q.get("wait") + " s", q.get("wait"))); waitSel.value = q.get("wait"); }
    if (q.get("layout")) layoutSel.value = q.get("layout");
    if (q.get("scene")) sceneSel.value = q.get("scene");
    const panels = document.querySelector("[data-panels]"), timer = document.querySelector("[data-timer]");
    let run = 0;
    function start() {
      const id = ++run, wait = Number(waitSel.value) * 1000, layout = layoutSel.value, t0 = performance.now();
      if (styleSel.value === "who") {
        // the real BTSUI.who(), with the booking call faked to answer after the chosen wait (sample names only)
        panels.innerHTML = `<section class="bk-card"><h2 class="bk-h3">Who's going</h2><div data-who></div></section>`;
        const sample = { booked: 7, listed: [
          { name: "Sam T.", club: "WPNSA", rig: "6" }, { name: "Ella R.", club: "Hayling Island SC", rig: "6" },
          { name: "Josh M.", club: "Rutland SC", rig: "7" }, { name: "Maya K.", club: "Draycote Water SC", rig: "4" },
          { name: "Leo B.", club: "Parkstone YC", rig: "6" } ] };
        window.BTSBook.call = () => new Promise(res => setTimeout(() => res(sample), wait));
        window.BTSUI.who(panels.querySelector("[data-who]"), "test");
      }
      const styles = styleSel.value === "all" ? ["race", "start", "wave"] : [styleSel.value];
      const name = { race: "Race", start: "Start line", wave: "Wave" };
      const head = st => styles.length > 1 ? `<p class="eyebrow" style="margin:8px 0 0">${name[st]}</p>` : "";
      const full = st => `${head(st)}<div data-slot><p class="bk-muted bk-loading" data-loader="${st}" data-scene="${sceneSel.value}">Loading camp…</p></div>`;
      const card = st => `${styles.length > 1 && layout === "card" ? head(st) : ""}<section class="bk-card" data-slot><h2 class="bk-h3">Open for booking</h2><p class="bk-muted bk-loading" data-loader="${st}" data-scene="${sceneSel.value}">Loading camps…</p></section>`;
      if (styleSel.value !== "who") panels.innerHTML = styles.map(st => layout === "full" ? full(st) : layout === "card" ? card(st) : full(st) + card(st)).join("");
      const tick = setInterval(() => { if (id !== run) return clearInterval(tick); timer.textContent = ((performance.now() - t0) / 1000).toFixed(1) + " s"; }, 100);
      setTimeout(() => {
        if (id !== run) return;
        clearInterval(tick);
        timer.innerHTML = `<span class="lt-done">Loaded in ${(wait / 1000).toFixed(1)} s</span>`;
        panels.querySelectorAll("[data-slot]").forEach(s => {
          const inCard = s.classList.contains("bk-card");
          s.innerHTML = (inCard ? `<h2 class="bk-h3">Open for booking</h2>` : `<h2 class="bk-h">Autumn Training Series · Weymouth</h2>`) +
            `<p class="bk-muted">Sat 21 – Sun 22 Nov · ILCA 4 / 6 / 7 · 4 places left</p>`;
        });
      }, wait);
      const u = new URL(location); u.searchParams.set("wait", waitSel.value); u.searchParams.set("layout", layout); u.searchParams.set("style", styleSel.value); u.searchParams.set("scene", sceneSel.value); history.replaceState(null, "", u);
    }
    document.querySelector("[data-replay]").addEventListener("click", start);
    waitSel.addEventListener("change", start); styleSel.addEventListener("change", start); layoutSel.addEventListener("change", start); sceneSel.addEventListener("change", start);
    start();
  })();
  </script>
</body>
</html>
